<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>본문 순서 맞추기 · 박문여고2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: an OMR answer strip — one 480px column. Study screen = top bar, bubble track, a single question card, answer controls in the thumb zone. */
:root{
  color-scheme:light;
  --paper:#FAF5F6;
  --card:#FFFFFF;
  --ink:#1B1517;
  --muted:#6B5F63;
  --omr:#C93549;
  --omr-line:#EDC3CA;
  --omr-wash:#FBEAED;
  --rule:#E8DDE0;
  --font-word:"Atkinson Hyperlegible","Helvetica Neue",Arial,sans-serif;
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151113;--card:#1F191C;--ink:#F2EBED;--muted:#A99CA1;
    --omr:#F0697B;--omr-line:#5A3038;--omr-wash:#3A1F26;--rule:#342A2E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151113;--card:#1F191C;--ink:#F2EBED;--muted:#A99CA1;
  --omr:#F0697B;--omr-line:#5A3038;--omr-wash:#3A1F26;--rule:#342A2E;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
#app{min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
b{font-weight:600}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 16px;border:1.5px solid var(--ink);border-radius:6px;background:var(--card);color:var(--ink);font-weight:600;font-size:15px;line-height:1.2;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn-primary{background:var(--ink);color:var(--card)}
.btn-quiet{border-color:var(--rule);font-weight:500}
.btn-small{min-height:38px;padding:0 12px;font-size:14px}
.big{min-height:56px;font-size:16px}
.wide{width:100%}
.linkish{background:none;border:0;padding:8px 0;color:var(--muted);font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--omr-line);cursor:pointer;touch-action:manipulation}
.linkish:disabled{opacity:.45;text-decoration:none;cursor:default}
.eyebrow{margin:0;font-size:12px;line-height:1.4;font-weight:600;letter-spacing:.12em;color:var(--omr)}

/* home */
.home{display:flex;flex-direction:column;gap:22px}
.masthead{display:grid;gap:10px;padding-bottom:18px;border-bottom:1.5px solid var(--omr)}
.fields{display:flex;flex-wrap:wrap;gap:6px}
.field{display:inline-flex;border:1px solid var(--omr);font-size:12px;line-height:1}
.field b{background:var(--omr);color:var(--card);padding:5px 7px;letter-spacing:.08em}
.field span{padding:5px 8px;color:var(--ink)}
h1{margin:0;font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.lede{margin:0;color:var(--muted)}
.rules{display:grid;gap:10px;padding:14px;background:var(--card);border:1px solid var(--omr-line);border-radius:2px}
.rules ol{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.rules li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;font-size:14px;line-height:1.5}
.rules-fold{background:var(--card);border:1px solid var(--omr-line);border-radius:2px}
.rules-fold summary{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;cursor:pointer;list-style:none;font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--omr);touch-action:manipulation;-webkit-user-select:none;user-select:none}
.rules-fold summary::-webkit-details-marker{display:none}
.rules-fold summary::before{content:"+";font-family:var(--font-mono);font-size:15px;letter-spacing:0}
.rules-fold[open] summary::before{content:"−"}
.rules-fold ol{list-style:none;margin:0;padding:0 14px 14px;display:grid;gap:9px}
.rules-fold li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;font-size:14px;line-height:1.5}
.num{width:18px;height:23px;margin-top:-1px;border:1.5px solid var(--omr);border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--omr)}
.sets{display:grid;gap:12px}
.sets-h{display:flex;justify-content:space-between;align-items:baseline;color:var(--omr);font-size:12px}
.group-h{margin:10px 0 -2px;padding-top:12px;border-top:1px solid var(--rule);font-size:15px;font-weight:700;line-height:1.35}
.sets-h + .group-h{margin-top:0;padding-top:0;border-top:0}
.set{display:grid;gap:10px;padding:14px;background:var(--card);border:1px solid var(--rule);border-radius:2px}
.set-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.set-title{min-width:0;font-weight:600;font-size:16px;line-height:1.35}
.set-count{flex:none;font-size:12.5px;color:var(--muted)}
.set-note{margin-top:-6px;font-size:13px;color:var(--muted)}
.set-status{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;padding:1px 9px;border:1px solid var(--omr);border-radius:999px;color:var(--omr);font-size:12.5px}
.set-actions{display:flex;flex-wrap:wrap;gap:8px}
.set-actions .btn{flex:1 1 auto}
.del{justify-self:start;padding:0}
.confirm{display:grid;gap:8px;padding:10px 12px;background:var(--omr-wash);border-radius:2px;font-size:14px}
.confirm-btns{display:flex;gap:8px;justify-content:flex-end}
details.paste{border-top:1px solid var(--rule);padding-top:14px}
details.paste summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:8px;font-weight:600}
details.paste summary::-webkit-details-marker{display:none}
details.paste summary::before{content:"+";font-family:var(--font-mono);color:var(--omr)}
details.paste[open] summary::before{content:"−"}
details.paste summary .sum-l{margin-right:auto}
.sum-r{font-size:12.5px;font-weight:400;color:var(--muted)}
.paste-body{display:grid;gap:8px;margin-top:12px}
.paste-body label{font-size:13px;color:var(--muted)}
.paste-body input,.paste-body textarea{width:100%;border:1px solid var(--rule);background:var(--card);border-radius:4px;padding:10px 12px;font-size:15px}
.paste-body textarea{font-family:var(--font-mono);font-size:13px;line-height:1.5;resize:vertical;min-height:132px;tab-size:4}
.paste-status{margin:0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.paste-status.bad{color:var(--omr)}
.paste-status.ok{color:var(--ink)}
.foot{margin:0;font-size:12.5px;line-height:1.65;color:var(--muted)}

/* study */
.study{flex:1;display:flex;flex-direction:column;gap:10px;padding-block:10px 14px}
.bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.back{min-height:40px;padding:0 12px;border:1px solid var(--rule);border-radius:6px;background:var(--card);font-size:14px;cursor:pointer;touch-action:manipulation}
.bar-mid{min-width:0}
.bar-title{font-weight:600;font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-sub{font-size:12px;line-height:1.4;color:var(--omr);font-weight:500}
.clock{font-size:14px;color:var(--muted)}
.track{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:10px;min-height:26px}
.track-grid{display:grid;gap:3px}
.ticks,.bubbles{display:flex;gap:4px}
.ticks i{flex:1 1 0;max-width:12px;height:4px;background:var(--ink)}
.bubbles .bb{flex:1 1 0;max-width:12px;height:16px;border:1.5px solid var(--omr);border-radius:50%}
.bb.dot{background:radial-gradient(circle,var(--omr) 0 2.4px,transparent 2.9px)}
.bb.full{background:var(--ink);border-color:var(--ink)}
.track-n{font-size:13px;color:var(--muted)}
.meter{display:flex;align-self:center;height:10px;border:1.5px solid var(--omr);border-radius:999px;overflow:hidden;background:var(--card)}
.meter i{display:block;height:100%;background:var(--ink);transition:width .25s ease}
.meter b{display:block;height:100%;background:var(--omr-line);transition:width .25s ease}
.banner{font-size:13px;line-height:1.45;padding:7px 10px;background:var(--omr-wash);border-radius:2px}
.card{position:relative;flex:1;display:flex;flex-direction:column;min-height:300px;padding:14px 16px 18px;background:var(--card);border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dir{display:inline-flex;border:1px solid var(--omr);font-size:12px;line-height:1}
.dir b{background:var(--omr);color:var(--card);padding:5px 7px;letter-spacing:.06em}
.dir span{padding:5px 8px;color:var(--omr)}
.left{font-size:12.5px;color:var(--muted)}
.zone{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding-top:18px}
#ke-zone{justify-content:flex-start;padding-top:24px}
.word{font-family:var(--font-word);font-weight:700;font-size:clamp(32px,10.5vw,50px);line-height:1.12;text-align:center;text-wrap:balance;overflow-wrap:anywhere}
.tbar{width:min(220px,70%);height:3px;margin:0 auto;background:var(--omr-wash);border-radius:2px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--omr);transform-origin:left center}
.tbar.run i{animation:drain 5s linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.say{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;min-width:36px;padding:0 12px;border:1px solid var(--rule);border-radius:999px;background:var(--card);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;touch-action:manipulation}
.say:active{background:var(--omr-wash)}
.say-row{display:flex;justify-content:center}
.fb-say{display:flex;align-items:center;gap:10px}
.hard li .say{padding:0;min-height:32px;min-width:32px;justify-self:end}
.ek-hint{font-size:13px;color:var(--muted);text-align:center}
.ek-hint.late{color:var(--omr);font-weight:500}
.reveal{display:grid;gap:7px;padding-top:14px;border-top:1px dashed var(--omr-line);text-align:center}
.core{font-size:23px;font-weight:700;line-height:1.35;text-wrap:balance}
.notes{display:grid;gap:3px;font-size:14px;line-height:1.5;color:var(--muted);text-wrap:pretty}
.notes:empty{display:none}
.notes p{margin:0}
.ko-prompt{font-size:26px;font-weight:700;line-height:1.3;text-wrap:balance}
.slots{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--font-mono);font-size:18px;letter-spacing:.2em;color:var(--muted)}
.slots .ph{color:var(--omr);letter-spacing:0}
.answer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
#ke-input{width:100%;min-width:0;padding:8px 2px;border:0;border-bottom:2px solid var(--ink);border-radius:0;background:transparent;font-family:var(--font-mono);font-size:22px;outline:none}
#ke-input:focus{border-bottom-color:var(--omr)}
.ke-tools{display:flex;flex-wrap:wrap;gap:4px 18px}
.ke-fb{display:grid;gap:6px;font-size:14px}
.ke-fb:empty{display:none}
.fb{display:grid;gap:4px;margin:0}
.fb-row{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:baseline}
.fb-row dt{font-size:12px;color:var(--muted)}
.fb-row dd{margin:0}
.diff{font-family:var(--font-mono);font-size:19px;overflow-wrap:anywhere}
.diff .miss{color:var(--omr);background:var(--omr-wash);font-weight:600;box-shadow:inset 0 -2px 0 var(--omr)}
.diff .xtra{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--omr)}
.ok-word{margin:0;font-family:var(--font-word);font-weight:700;font-size:20px}
.warn{margin:0;color:var(--omr)}
.note{margin:0;font-size:14px;color:var(--muted)}
.actions{display:grid;gap:8px}
.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grade .btn{min-height:56px;padding:0 8px}
.stamp{position:absolute;top:40px;right:14px;width:60px;height:60px;pointer-events:none;opacity:0}
.stamp.on{opacity:.9;animation:stamp .18s ease-out}
.stamp.ok{border:4px solid var(--omr);border-radius:50%}
.stamp.x::before{content:"";position:absolute;left:calc(50% - 2.5px);top:-6px;bottom:-6px;width:5px;border-radius:3px;background:var(--omr);transform:rotate(38deg)}
@keyframes stamp{from{transform:scale(1.45);opacity:0}to{transform:scale(1);opacity:.9}}
@media (max-height:700px){
  .study.ke-mode .track,.study.ke-mode .banner{display:none}
  .study.ke-mode #ke-zone{padding-top:14px}
}

/* pause + result */
.pause,.result{flex:1;display:flex;flex-direction:column;gap:16px}
.pause{justify-content:center}
.big-h{margin:0;font-size:28px;line-height:1.25;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin:0;background:var(--rule);border:1px solid var(--rule)}
.stats div{background:var(--card);padding:11px 12px;min-width:0}
.stats dt{font-size:12px;color:var(--muted)}
.stats dd{margin:2px 0 0;font-family:var(--font-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.submit{display:grid;gap:8px;padding:14px;background:var(--card);border:1.5px solid var(--omr);border-radius:2px}
.submit h3{margin:0;font-size:15px}
.submit label{font-size:13px;color:var(--muted)}
.submit-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.submit input{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--rule);border-radius:4px;background:var(--card);font-size:16px}
.submit .btn{text-decoration:none}
.hard{display:grid;gap:8px}
.hard h3{margin:0;font-size:15px}
.hard ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.hard li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px}
.hard ul.with-say li{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) auto;align-items:center}
.hard .en{font-family:var(--font-word);font-weight:700;font-size:16px;overflow-wrap:anywhere}

/* order: 섞인 문장 카드를 끌어서(오른쪽 손잡이를 잡거나 꾹 눌러서) 교과서 순서로 배열. 확인 뒤엔 정답 순서로 다시 나열 */
.od-head{position:relative;display:grid;gap:6px;padding:12px 14px 14px;background:var(--card);border:1px solid var(--rule);border-radius:2px}
.od-name{margin:4px 0 0;font-size:20px;line-height:1.3;font-weight:700;text-wrap:balance}
.od-hint{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.od-hint.ok{color:var(--ink)}
.od-hint.bad{color:var(--omr);font-weight:500}
.od-flow{margin:2px 0 0;padding-top:8px;border-top:1px dashed var(--omr-line);font-size:13px;line-height:1.55;color:var(--ink);text-wrap:pretty}
.od-flow b{color:var(--omr);font-weight:600;margin-right:4px}
.od-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.od-line{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:2px;background:var(--card);color:var(--ink);text-align:left;font-family:var(--font-word);font-size:16.5px;line-height:1.45;overflow-wrap:anywhere}
.od-list.pick .od-line{grid-template-columns:28px minmax(0,1fr) 34px;padding-right:0;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
.od-grip{display:grid;place-items:center;align-self:stretch;margin:-11px 0;color:var(--muted);touch-action:none;cursor:grab}
.od-grip svg{display:block}
.grip-ic{display:inline-grid;place-items:center;width:18px;height:18px;margin:0 1px;vertical-align:-4px;border:1px solid var(--rule);border-radius:3px;color:var(--muted)}
.grip-ic svg{width:9px;height:14px}
.od-line.drag{z-index:3;border-color:var(--ink);box-shadow:0 10px 24px rgba(0,0,0,.18);background:var(--omr-wash);cursor:grabbing}
.od-line.drag .od-grip{cursor:grabbing}
.od-bb{width:26px;height:26px;margin-top:1px;border:1.5px solid var(--omr);border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--omr);background:var(--card)}
.od-list.pick .od-bb{background:var(--ink);border-color:var(--ink);color:var(--card)}
.od-line.hit .od-bb{background:var(--ink);border-color:var(--ink);color:var(--card)}
.od-line.miss{border-color:var(--omr);background:var(--omr-wash)}
.od-line.miss .od-bb{background:var(--omr);border-color:var(--omr);color:var(--card)}
.od-mine{display:block;margin-top:3px;font-family:var(--font-ui);font-size:12.5px;font-weight:600;color:var(--omr)}
.od-cue{display:block;margin-top:4px;padding-top:4px;border-top:1px dashed var(--rule);font-family:var(--font-ui);font-size:12.5px;line-height:1.45;color:var(--muted);text-wrap:pretty}
.od-line.miss .od-cue{color:var(--ink);border-top-color:var(--omr-line)}
.od-foot{position:sticky;bottom:0;z-index:4;display:grid;gap:4px;margin-top:4px;padding:10px 0 max(10px,env(safe-area-inset-bottom,0px));background:var(--paper);box-shadow:0 -10px 10px -6px var(--paper)}

/* keyword: 지문을 읽고 주제의 핵심어 보기를 모두 고름. 확인 뒤엔 한 줄 주제 → 핵심·오답 줄(틀린 것에만 이유) → 본문 */
.kw-body{display:grid;gap:6px}
.kw-cap{margin:0;font-size:12.5px;color:var(--muted)}
.kw-text{margin:0;padding:12px 14px;background:var(--card);border:1px solid var(--rule);border-radius:2px;font-family:var(--font-word);font-size:16.5px;line-height:1.62;word-break:normal;overflow-wrap:break-word}
.kw-n{display:inline-block;margin-right:3px;font-family:var(--font-mono);font-size:10.5px;font-weight:600;line-height:1;color:var(--omr);vertical-align:2px}
.kw-zone{display:grid;gap:10px}
.kw-ask{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.kw-chips{display:flex;flex-wrap:wrap;gap:8px}
.kw-chip{display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:0 15px;border:1.5px solid var(--rule);border-radius:999px;background:var(--card);color:var(--ink);font-family:var(--font-word);font-size:16px;font-weight:700;line-height:1.2;text-align:left;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.kw-chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.kw-chip[aria-pressed="true"]::before{content:"✓";font-family:var(--font-ui);font-size:13px;font-weight:600}

  s.queue = shuffle(s.pool.slice()).map(id => ({ id, d: SET.items[id].ke && Math.random() < 0.5 ? 'ke' : 'ek' }));
  spreadRecent(s.queue, s.recent);
}
/* 틀린 카드는 3~6장 뒤로. 남은 카드가 모자라면 이미 외운 단어로 사이를 채워 바로 다시 나오지 않게 함 */
function requeue(s, card, lo, hi) {
  const gap = lo + rnd(hi - lo + 1);
  if (s.queue.length < gap) pad(s, card.id, gap - s.queue.length);
  s.queue.splice(Math.min(gap, s.queue.length), 0, card);
}
function pad(s, avoid, need) {
  const scope = s.phase === 'learn' ? s.batches[s.b] : s.pool;
  const inQ = new Set(s.queue.map(c => c.id));
  const rec = new Set(s.recent.slice(-2));
  const cand = shuffle(scope.filter(id => id !== avoid && !inQ.has(id) && !rec.has(id) && (s.phase !== 'learn' || s.st[id].m)));
  const k = Math.min(need, 3, cand.length);
  for (let i = 0; i < k; i++) s.queue.push({ id: cand[i], d: SET.items[cand[i]].ke && Math.random() < 0.5 ? 'ke' : 'ek', rv: 1 });
}
/* res: 영→한 'yes'|'meh'|'no', 한→영 'ok'|'hint'|'wrong'|'dunno' */
function answer(res) {
  const s = S.sess, card = s.queue.shift();
  if (!card) return;
  const id = card.id, x = s.st[id], it = SET.items[id];
  tick(s); x.sn = 1;
  if (s.phase === 'sort') {
    x.k = res === 'yes' ? 1 : 0; x.ek = x.k;
  } else if (s.phase === 'learn') {
    if (card.d === 'ek') { if (res === 'yes') x.ek = 1; else { x.ek = 0; x.f++; } }
    else if (res === 'ok') x.ke = 1;
    else { x.ke = 0; if (res !== 'hint') x.f++; }
    const need = !x.ek ? 'ek' : (it.ke && !x.ke ? 'ke' : '');
    if (need) { x.m = 0; requeue(s, { id, d: need }, 3, need === card.d ? 5 : 6); }
    else x.m = 1;
  } else if (s.phase === 'final') {
    const good = card.d === 'ek' ? res === 'yes' : res === 'ok';
    if (good) { if (!card.rv) s.fDone++; }
    else {
      if (card.rv) s.fDone--;
      x.ff = 1; if (res !== 'hint') x.f++;
      requeue(s, { id, d: card.d }, 3, 5);
    }
  }
  s.recent.push(id); if (s.recent.length > 4) s.recent.shift();
  if (!s.queue.length) endPhase(s);
  save();
}
function endPhase(s) {
  if (s.phase === 'sort') {
    const ids = s.batches[s.b], known = ids.filter(id => s.st[id].k).length, unknown = ids.length - known;
    startLearn(s);
    S.banner = `거르기 끝 · ${ids.length}개 중 ${known}개 바로 나옴. ` + (unknown ? `이제 안 나온 ${unknown}개 다시 + 철자 확인.` : '이제 철자 확인.');
    if (!s.queue.length) { s.phase = 'bdone'; S.banner = ''; }
  } else if (s.phase === 'learn') {

  } else if (s.phase === 'final') {

  }
}
function finish(s) {
  const pool = s.pool;
  const hard = pool.filter(id => s.st[id].f >= 2 || s.st[id].ff);
  const known = s.mode === 'quick' ? pool.filter(id => !s.st[id].ff).length : pool.filter(id => s.st[id].k).length;
  const rec = getRec(s.setId);
  rec.hard = hard;
  rec.last = { at: Date.now(), ms: s.ms, n: pool.length, mode: s.mode, known, hard: hard.length };
  if (s.mode === 'full' && (!rec.best || s.ms < rec.best)) rec.best = s.ms;
  store.set(K.rec(s.setId), rec);
  S.result = { setId: s.setId, title: SET.title, mode: s.mode, n: pool.length, ms: s.ms, known, hard };
  store.del(K.sess(s.setId));
}
function nextBatch() {
  const s = S.sess;
  if (!s) { renderHome(); return; }
  if (s.b + 1 < s.batches.length) { s.b++; startSort(s); } else startFinal(s);
  s.lt = Date.now();
  save(); route();
}
function tick(s) { const now = Date.now(); s.ms += Math.max(0, Math.min(now - (s.lt || now), CAP)); s.lt = now; }
function startClock() {
  stopClock();
  const up = () => { const s = S.sess, el = R['st-clock']; if (s && el) el.textContent = fmt(s.ms + Math.max(0, Math.min(Date.now() - s.lt, CAP))); };
  up(); clockT = setInterval(up, 1000);
}
function stopClock() { if (clockT) clearInterval(clockT); clockT = null; }

/* ---------- 순서 맞추기 엔진 ----------
   세트(과)의 지문을 교과서 순서대로 하나씩 냄. 지문마다 문장을 새로 섞고, 학생이 다 놓으면 채점.
   틀린 지문은 큐 맨 뒤로 가서 다시 나오고, 모든 지문을 맞혀야 끝. st[id] = { t: 시도 수, w: 틀린 수 } */
function newOrderSession(set, mode) {
  const n = set.passages.length;
  let pool = set.passages.map((_, i) => i);
  if (mode === 'hard') {
    pool = (getRec(set.id).hard || []).filter(id => Number.isInteger(id) && id >= 0 && id < n);
    if (!pool.length) return null;
  }
  const st = {};
  pool.forEach(id => { st[id] = { t: 0, w: 0 }; });
  const s = { v: 2, kind: 'order', setId: set.id, n, mode, pool, st, queue: pool.slice(), cur: null, done: 0, phase: 'play', ms: 0, lt: Date.now() };
  openPassage(s);
  return s;
}
function openPassage(s) {
  const id = s.queue[0];
  if (id == null) { s.cur = null; return; }
  s.cur = { id, picks: shuffleOrder(SET.passages[id].lines.length), fb: null };
}
function validOrder(s) {
  const n = SET.passages.length;
  const ok = id => Number.isInteger(id) && id >= 0 && id < n;
  if (!Array.isArray(s.pool) || !s.pool.every(ok) || !Array.isArray(s.queue) || !s.queue.every(ok)) return false;
  if (!s.st || typeof s.st !== 'object' || !s.pool.every(id => s.st[id])) return false;
  const c = s.cur;
  if (!c || !ok(c.id) || (s.queue[0] !== c.id && !c.fb)) return false;
  const m = SET.passages[c.id].lines.length;
  const perm = a => Array.isArray(a) && a.length === m && a.slice().sort((x, y) => x - y).every((v, i) => v === i);
  return perm(c.picks) && (!c.fb || perm(c.fb.picks));
}
function orderCheck() {
  const s = S.sess, c = s && s.cur;
  if (!c || c.fb) return;
  const p = SET.passages[c.id];
  if (DRAG) endDrag();
  if (c.picks.length !== p.lines.length) return;
  tick(s);
  const g = gradeOrder(c.picks, p.lines.length), x = s.st[c.id];
  x.t++;
  s.queue.shift();
  if (g.ok) s.done++; else { x.w++; s.queue.push(c.id); }
  c.fb = { ok: g.ok, right: g.right, picks: c.picks.slice() };
  save(); renderOrderFeedback();
}
function orderNext() {
  const s = S.sess;
  if (!s || !s.cur || !s.cur.fb) return;
  tick(s);
  if (!s.queue.length) { s.cur = null; finishOrder(s); stopClock(); renderResult(); return; }
  openPassage(s); save(); renderOrder();
}
function finishOrder(s) {
  const hard = s.pool.filter(id => s.st[id].w > 0);
  const known = s.pool.length - hard.length;
  const rec = getRec(s.setId);
  rec.hard = hard;
  rec.last = { at: Date.now(), ms: s.ms, n: s.pool.length, mode: s.mode, known, hard: hard.length };
  if (s.mode === 'full' && (!rec.best || s.ms < rec.best)) rec.best = s.ms;
  store.set(K.rec(s.setId), rec);
  const tries = {};
  s.pool.forEach(id => { tries[id] = s.st[id].t; });
  S.result = { kind: 'order', setId: s.setId, title: SET.title, mode: s.mode, n: s.pool.length, ms: s.ms, known, hard, tries };
  s.phase = 'done';
  store.del(K.sess(s.setId));
}
function beginOrder(raw, mode) {
  SET = prepareOrder(raw);
  if (!SET.passages.length) { renderHome(); return; }
  let s = null;
  if (mode === 'resume') {
    s = liveOrder(SET.id, SET.passages.length);
    if (s && !validOrder(s)) s = null;
    if (s) s.lt = Date.now();
    else s = newOrderSession(SET, 'full');
  } else s = newOrderSession(SET, mode === 'hard' ? 'hard' : 'full');
  if (!s) { renderHome(); return; }
  S.sess = s; S.confirm = null; S.banner = '';
  save(); route();
}

/* ---------- 핵심어 고르기 엔진 ----------
   세트(강)의 지문을 차례대로 하나씩 냄. 지문마다 보기를 새로 섞고, 고른 보기가 핵심어와 똑같아야 정답
   (핵심을 하나라도 빠뜨리거나 오답을 하나라도 고르면 다시). 틀린 지문은 큐 맨 뒤로 가서 보기가 새로 섞인 채 다시 나오고,
   모든 지문을 맞혀야 끝. st[id] = { t: 시도 수, w: 틀린 수 } */
function newKwSession(set, mode) {
  const n = set.passages.length;
  let pool = set.passages.map((_, i) => i);
  if (mode === 'hard') {
    pool = (getRec(set.id).hard || []).filter(id => Number.isInteger(id) && id >= 0 && id < n);
    if (!pool.length) return null;
  }
  const st = {};
  pool.forEach(id => { st[id] = { t: 0, w: 0 }; });
  const s = { v: 3, kind: 'kw', setId: set.id, n, mode, pool, st, queue: pool.slice(), cur: null, done: 0, phase: 'play', ms: 0, lt: Date.now() };
  openKw(s);
  return s;
}
function openKw(s) {
  const id = s.queue[0];
  if (id == null) { s.cur = null; return; }
  s.cur = { id, order: shuffleKw(SET.passages[id].opts.map(o => o.key)), picks: [], fb: null };
}
function validKw(s) {
  const n = SET.passages.length;
  const ok = id => Number.isInteger(id) && id >= 0 && id < n;
  if (!Array.isArray(s.pool) || !s.pool.every(ok) || !Array.isArray(s.queue) || !s.queue.every(ok)) return false;
  if (!s.st || typeof s.st !== 'object' || !s.pool.every(id => s.st[id])) return false;
  const c = s.cur;
  if (!c || !ok(c.id) || (s.queue[0] !== c.id && !c.fb)) return false;
  const m = SET.passages[c.id].opts.length;
  const sub = a => Array.isArray(a) && a.every(v => Number.isInteger(v) && v >= 0 && v < m) && new Set(a).size === a.length;
  return sub(c.order) && c.order.length === m && sub(c.picks) && (!c.fb || sub(c.fb.picks));
}
function kwToggle(i) {
  const s = S.sess, c = s && s.cur;
  if (!c || c.fb) return;
  const k = c.picks.indexOf(i);
  if (k >= 0) c.picks.splice(k, 1); else c.picks.push(i);
  save();
}
function kwCheck() {
  const s = S.sess, c = s && s.cur;
  if (!c || c.fb || !c.picks.length) return;
  tick(s);
  const g = gradeKw(c.picks, SET.passages[c.id].opts), x = s.st[c.id];
  x.t++;
  s.queue.shift();
  if (g.ok) s.done++; else { x.w++; s.queue.push(c.id); }
  c.fb = { ok: g.ok, picks: c.picks.slice() };
  save(); renderKwFeedback();
}
function kwNext() {
  const s = S.sess;
  if (!s || !s.cur || !s.cur.fb) return;
  tick(s);
  if (!s.queue.length) { s.cur = null; finishKw(s); stopClock(); renderResult(); return; }
  openKw(s); save(); renderKw();
}
function finishKw(s) {
  const hard = s.pool.filter(id => s.st[id].w > 0);
  const known = s.pool.length - hard.length;
  const rec = getRec(s.setId);
  rec.hard = hard;
  rec.last = { at: Date.now(), ms: s.ms, n: s.pool.length, mode: s.mode, known, hard: hard.length };
  if (s.mode === 'full' && (!rec.best || s.ms < rec.best)) rec.best = s.ms;
  store.set(K.rec(s.setId), rec);
  const tries = {};
  s.pool.forEach(id => { tries[id] = s.st[id].t; });
  S.result = { kind: 'kw', setId: s.setId, title: SET.title, mode: s.mode, n: s.pool.length, ms: s.ms, known, hard, tries };
  s.phase = 'done';
  store.del(K.sess(s.setId));
}
function beginKw(raw, mode) {
  SET = prepareKw(raw);
  if (!SET.passages.length) { renderHome(); return; }
  let s = null;
  if (mode === 'resume') {
    s = liveKw(SET.id, SET.passages.length);
    if (s && !validKw(s)) s = null;
    if (s) s.lt = Date.now();
    else s = newKwSession(SET, 'full');
  } else s = newKwSession(SET, mode === 'hard' ? 'hard' : 'full');
  if (!s) { renderHome(); return; }
  S.sess = s; S.confirm = null; S.banner = '';
  save(); route();
}

function begin(id, mode) {
  const raw = findRaw(id);
  if (!raw) { renderHome(); return; }
  if (raw.kind === 'order') { beginOrder(raw, mode); return; }
  if (raw.kind === 'kw') { beginKw(raw, mode); return; }
  SET = prepareSet(raw);
  if (!SET.items.length) { renderHome(); return; }
  let s = null;
  if (mode === 'resume') {
    s = liveSess(id, SET.items.length);
    if (s && !validSess(s)) s = null;
    if (s) s.lt = Date.now();
    else s = newSession(SET, 'full');
  } else s = newSession(SET, mode);
  if (!s) { renderHome(); return; }
  S.sess = s; S.confirm = null; S.banner = '';
  save(); route();
}
function validSess(s) {
  const n = SET.items.length;
  const ok = id => Number.isInteger(id) && id >= 0 && id < n;
  return Array.isArray(s.pool) && s.pool.every(ok) && Array.isArray(s.queue) && s.queue.every(c => c && ok(c.id)) &&
    s.st && typeof s.st === 'object' && s.pool.every(id => s.st[id]) && Array.isArray(s.batches) && Array.isArray(s.recent);
}
function route() {
  const s = S.sess;
  if (!s) { renderHome(); return; }
  if (s.kind === 'order') {
    if (s.phase === 'done') { renderResult(); return; }
    if (!s.cur) { finishOrder(s); renderResult(); return; }
    renderOrder(); return;
  }
  if (s.kind === 'kw') {
    if (s.phase === 'done') { renderResult(); return; }
    if (!s.cur) { finishKw(s); renderResult(); return; }
    renderKw(); return;
  }
  if (s.phase === 'bdone') { renderPause(); return; }
  if (s.phase === 'done') { renderResult(); return; }
  if (!s.queue.length) { endPhase(s); save(); route(); return; }
  renderStudy();

/* ---------- 목록 화면 ---------- */
function sessLabel(ss) {
  const B = (ss.batches || []).length;
  if (ss.phase === 'final') return `${ss.mode === 'quick' ? '빠른 점검' : '마지막 점검'} ${ss.fDone}/${ss.pool.length}`;
  if (ss.phase === 'bdone') return `배치 ${ss.b + 1}/${B} 끝`;

}

/* 순서 세트 카드: 과 하나, 지문 수·문장 수, 진행 중/지난 기록, 순서 맞추기·틀린 지문만 */

  const sid = esc(set.id);

  if (rec.last) status.push(`<span>지난 기록 ${fmt(rec.last.ms)} · 한 번에 ${rec.last.known}/${rec.last.n}${rec.last.mode === 'hard' ? ' (틀린 지문만)' : ''}</span>`);

/* 핵심어 세트 카드: 강 하나, 지문 수, 진행 중/지난 기록, 핵심어 고르기·틀린 지문만 */

  if (rec.last) status.push(`<span>지난 기록 ${fmt(rec.last.ms)} · 한 번에 ${rec.last.known}/${rec.last.n}${rec.last.mode === 'hard' ? ' (틀린 지문만)' : ''}</span>`);
  if (!ss && !rec.last) status.push('<span>아직 안 함</span>');

    ${set.note ? `<div class="set-note">${esc(set.note)}</div>` : ''}
    <div class="set-status">${status.join('')}</div>

}
function setCard(raw) {
  if (raw.kind === 'order') return orderCard(raw);

  const n = set.items.length;

  const ss = liveSess(set.id, n);

  }

  for (let i = 0; i < n; i++) b += `<span class="bb${i < full ? ' full' : i < full + dot ? ' dot' : ''}"></span>`;

    : `배치 ${s.b + 1}/${s.batches.length} · ${s.phase === 'sort' ? '거르기' : '집중'}`;

  const label = s.phase === 'learn' ? `${n}개 중 ${full}개 외움` : `${n}개 중 ${dot}개 거름`;

  DRAG = null;
  const s = S.sess;
  if (s && s.cur && !s.cur.fb) { s.cur.picks = rowsOf(list).map(r => +r.dataset.line); save(); }
}
function cancelHold() { if (HOLD) { clearTimeout(HOLD.t); HOLD = null; } }
function bindDrag(list) {
  const rowAt = e => { const li = e.target.closest('.od-line'); return li && list.classList.contains('pick') ? li : null; };
  /* 터치: 손잡이면 바로, 문장이면 꾹 눌러서 */
  list.addEventListener('touchstart', e => {
    if (DRAG || e.touches.length !== 1) return;
    const li = rowAt(e); if (!li) return;
    const t = e.touches[0];
    if (e.target.closest('.od-grip')) { startDrag(li, t.clientY, 'grip'); return; }
    cancelHold();
    HOLD = { li, x: t.clientX, y: t.clientY, t: setTimeout(() => { if (HOLD) { const h = HOLD; HOLD = null; startDrag(h.li, h.y, 'hold'); } }, 250) };
  }, { passive: true });
  list.addEventListener('touchmove', e => {
    if (DRAG) { e.preventDefault(); moveDrag(e.touches[0].clientY); return; }
    if (HOLD) { const t = e.touches[0]; if (Math.abs(t.clientX - HOLD.x) > 8 || Math.abs(t.clientY - HOLD.y) > 8) cancelHold(); }
  }, { passive: false });
  list.addEventListener('touchend', () => { cancelHold(); endDrag(); });
  list.addEventListener('touchcancel', () => { cancelHold(); endDrag(); });
  /* 마우스: 아무 데나 눌러서 */
  list.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0 || DRAG) return;
    const li = rowAt(e); if (!li) return;
    e.preventDefault();
    startDrag(li, e.clientY, 'mouse');
    const mv = ev => moveDrag(ev.clientY);
    const up = () => { document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up); endDrag(); };
    document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
  });
  list.addEventListener('contextmenu', e => { if (rowAt(e)) e.preventDefault(); });
  list.addEventListener('dragstart', e => e.preventDefault());
}

/* ---------- 배치 끝 / 결과 ---------- */
function renderPause() {
  S.view = 'pause'; app.onclick = null; stopClock();
  const s = S.sess, ids = s.batches[s.b], n = ids.length;
  const known = ids.filter(id => s.st[id].k).length;
  const last = s.b + 1 >= s.batches.length;
  app.innerHTML = `
<div class="wrap pause">
  <div class="eyebrow">${s.mode === 'hard' ? '끈질긴 단어 · ' : ''}배치 ${s.b + 1}/${s.batches.length} 끝</div>
  <div class="track">${trackHTML(n, n, 0)}<div class="track-n mono">${n}/${n}</div></div>
  <h2 class="big-h">${n}개 모두 꺼냈어</h2>
  <dl class="stats">
    <div><dt>이번 배치</dt><dd>${fmt(s.ms - (s.bms0 || 0))}</dd></div>
    <div><dt>바로 나온 단어</dt><dd>${known}</dd></div>
    <div><dt>전체 시간</dt><dd>${fmt(s.ms)}</dd></div>
  </dl>
  <p class="note">${last ? `이제 ${s.pool.length}개 전체를 섞어서 한 번씩 꺼내. 영→한과 한→영이 섞여 나와.` : '여기까지 저장됐어. 쉬었다 와도 다음 배치부터 이어서 할 수 있어.'}</p>
  <div class="actions">
    <button class="btn btn-primary wide big" id="go-next" type="button">${last ? '마지막 점검 시작' : `다음 배치 (${s.b + 2}/${s.batches.length})`}</button>
    <button class="btn btn-quiet wide" id="go-home" type="button">목록으로</button>
  </div>
</div>`;
  $('#go-next').onclick = nextBatch;
  $('#go-home').onclick = () => renderHome();
  window.scrollTo(0, 0);
}
/* 순서 세트 결과: 한 번에 맞힌 지문 수, 다시 한 지문 목록(몇 번 만에 맞혔는지). 제출 칸은 없음 */
function renderOrderResult(r) {
  S.sess = null;
  const hardP = r.hard.map(id => ({ id, p: SET.passages[id] })).filter(x => x.p);
  const kind = r.mode === 'hard' ? '틀린 지문만' : '순서 맞추기';
  app.innerHTML = `
<div class="wrap result">
  <div class="eyebrow">${kind} 끝 · ${esc(r.title)}</div>
  <h2 class="big-h">${r.n}지문 다 세웠어</h2>
  <dl class="stats">
    <div><dt>걸린 시간</dt><dd>${fmt(r.ms)}</dd></div>
    <div><dt>한 번에 맞힘</dt><dd>${r.known}</dd></div>
    <div><dt>다시 한 지문</dt><dd>${hardP.length}</dd></div>
  </dl>
  ${hardP.length ? `
  <section class="hard" aria-labelledby="hard-h">
    <h3 id="hard-h">다시 한 지문</h3>
    <p class="note">한 번에 못 맞힌 지문이야. 시험 전에 한 번 더 세워 봐.</p>
    <ul>${hardP.map(x => `<li><span class="en">${esc(x.p.name)}</span><span>${esc(x.p.kind)} ${x.p.lines.length}문장 · ${r.tries[x.id] || 2}번 만에</span></li>`).join('')}</ul>
  </section>` : `<p class="note">전부 한 번에 맞혔어.</p>`}
  <p class="note">시험 전날 한 번 더 세우면 오래 가.</p>
  <div class="actions">
    ${hardP.length ? `<button class="btn btn-primary wide big" id="r-hard" type="button">틀린 지문만 다시</button>` : ''}
    <button class="btn ${hardP.length ? 'btn-quiet' : 'btn-primary big'} wide" id="r-home" type="button">목록으로</button>
  </div>
</div>`;
  const h = $('#r-hard');
  if (h) h.onclick = () => begin(r.setId, 'hard');
  $('#r-home').onclick = () => renderHome();
  window.scrollTo(0, 0);
}
/* 핵심어 세트 결과: 한 번에 맞힌 지문 수, 다시 한 지문 목록. 처음부터 끝까지 했으면 구글폼 제출 칸
   (세트 '핵심어 · 16강', 끈질긴 단어 칸에는 다시 한 지문 '2지문: 16강 03(2번 만에), …') */
function renderKwResult(r) {
  S.sess = null;
  const hardP = r.hard.map(id => ({ id, p: SET.passages[id] })).filter(x => x.p);
  const kind = r.mode === 'hard' ? '틀린 지문만' : '핵심어 고르기';
  const tries = id => r.tries[id] || 2;
  app.innerHTML = `
<div class="wrap result">
  <div class="eyebrow">${kind} 끝 · ${esc(r.title)}</div>
  <h2 class="big-h">${r.n}지문 핵심어 다 골랐어</h2>
  <dl class="stats">
    <div><dt>걸린 시간</dt><dd>${fmt(r.ms)}</dd></div>
    <div><dt>한 번에 맞힘</dt><dd>${r.known}</dd></div>
    <div><dt>다시 한 지문</dt><dd>${hardP.length}</dd></div>
  </dl>
  ${FORM && r.mode !== 'full' ? `<p class="note">선생님께 제출은 ‘핵심어 고르기’를 처음부터 끝까지 했을 때만 할 수 있어.</p>` : ''}
  ${FORM && r.mode === 'full' ? submitHTML() : ''}
  ${hardP.length ? `
  <section class="hard" aria-labelledby="hard-h">
    <h3 id="hard-h">다시 한 지문</h3>
    <p class="note">한 번에 못 맞힌 지문이야. 주제의 핵심어가 뭐였는지 한 번 더 떠올려 봐.</p>
    <ul>${hardP.map(x => `<li><span class="en">${esc(x.p.name)}</span><span>핵심어 ${x.p.opts.filter(o => o.key).length}개 · ${tries(x.id)}번 만에</span></li>`).join('')}</ul>
  </section>` : `<p class="note">전부 한 번에 맞혔어.</p>`}
  <p class="note">시험 전에 한 번 더 고르면 주제가 더 빨리 보여.</p>
  <div class="actions">
    ${hardP.length ? `<button class="btn btn-primary wide big" id="r-hard" type="button">틀린 지문만 다시</button>` : ''}
    <button class="btn ${hardP.length ? 'btn-quiet' : 'btn-primary big'} wide" id="r-home" type="button">목록으로</button>
  </div>
</div>`;
  if (FORM && r.mode === 'full') {
    bindSubmit(r, `핵심어 · ${r.title}`, `${hardP.length}지문` + (hardP.length ? ': ' + hardP.map(x => `${x.p.name}(${tries(x.id)}번 만에)`).join(', ') : ''));
  }
  const h = $('#r-hard');
  if (h) h.onclick = () => begin(r.setId, 'hard');
  $('#r-home').onclick = () => renderHome();
  window.scrollTo(0, 0);
}
function submitHTML() {
  return `
  <section class="submit" aria-labelledby="sub-h">
    <h3 id="sub-h">선생님께 제출</h3>
    <label for="sub-name">이름</label>
    <div class="submit-row">
      <input type="text" id="sub-name" maxlength="20" autocomplete="name" placeholder="이름 쓰기">
      <a class="btn btn-primary" id="sub-go" href="#" target="_blank" rel="noopener">제출하러 가기</a>
    </div>
    <p class="note" id="sub-note">구글폼이 결과가 채워진 채로 열려. 거기서 <b>제출(Submit)</b>까지 눌러야 끝나.</p>
  </section>`;
}
function renderResult() {
  S.view = 'result'; app.onclick = null; stopClock();
  const r = S.result;
  if (!r) { renderHome(); return; }
  if (r.kind === 'order') { renderOrderResult(r); return; }
  if (r.kind === 'kw') { renderKwResult(r); return; }
  S.sess = null;
  const hardItems = r.hard.map(id => SET.items[id]).filter(Boolean);
  const kind = r.mode === 'quick' ? '빠른 점검' : r.mode === 'hard' ? '끈질긴 단어' : '외우기';
  app.innerHTML = `
<div class="wrap result">
  <div class="eyebrow">${kind} 끝 · ${esc(r.title)}</div>
  <h2 class="big-h">${r.mode === 'quick' ? `${r.n}개 점검 끝` : `${r.n}개 다 꺼냈어`}</h2>
  <dl class="stats">
    <div><dt>걸린 시간</dt><dd>${fmt(r.ms)}</dd></div>
    <div><dt>${r.mode === 'quick' ? '한 번에 맞힘' : '바로 나온 단어'}</dt><dd>${r.known}</dd></div>
    <div><dt>끈질긴 단어</dt><dd>${hardItems.length}</dd></div>
  </dl>
  ${FORM && r.mode !== 'full' ? `<p class="note">선생님께 제출은 ‘외우기’를 끝까지 했을 때만 할 수 있어.</p>` : ''}
  ${FORM && r.mode === 'full' ? submitHTML() : ''}
  ${hardItems.length ? `
  <section class="hard" aria-labelledby="hard-h">
    <h3 id="hard-h">끈질긴 단어</h3>
    <p class="note">여러 번 틀렸거나 마지막 점검에서 걸린 단어야.</p>
    <ul class="${hardItems.some(canSpeak) ? 'with-say' : ''}">${hardItems.map((it, i) => `<li><span class="en" lang="en">${esc(it.en)}</span><span>${esc(it.core)}</span>${sayBtn(it, i, '') || (hardItems.some(canSpeak) ? '<span></span>' : '')}</li>`).join('')}</ul>
  </section>` : `<p class="note">끈질긴 단어 없이 끝났어.</p>`}
  <p class="note">시험 전날 ‘빠른 점검’을 한 번 더 하면 오래 가.</p>
  <div class="actions">
    ${hardItems.length ? `<button class="btn btn-primary wide big" id="r-hard" type="button">끈질긴 단어만 다시</button>` : ''}
    <button class="btn ${hardItems.length ? 'btn-quiet' : 'btn-primary big'} wide" id="r-home" type="button">목록으로</button>
  </div>
</div>`;
  if (FORM && r.mode === 'full') bindSubmit(r, `${r.title} · ${kind}`, `${hardItems.length}개` + (hardItems.length ? ': ' + hardItems.map(it => it.en).join(', ') : ''));
  const hl = $('.hard ul');
  if (hl) hl.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b) speak(hardItems[+b.dataset.say]); });
  const h = $('#r-hard');
  if (h) h.onclick = () => begin(r.setId, 'hard');
  $('#r-home').onclick = () => renderHome();
  window.scrollTo(0, 0);
}

/* 결과를 선생님 구글폼으로: 미리 채워진 링크를 새 탭으로 열고, 학생이 폼에서 제출을 누름.
   setText = 세트 칸(단어 '기말 · 1~80번 · 외우기', 핵심어 '핵심어 · 16강'), hardText = 끈질긴 단어 칸 */
function bindSubmit(r, setText, hardText) {
  const nameEl = $('#sub-name'), go = $('#sub-go'), note = $('#sub-note');
  const noteHTML = note.innerHTML;
  const fmtKo = ms => { const t = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(t / 60)}분 ${t % 60}초`; };
  const sync = () => {
    const pairs = [['usp', 'pp_url'], [FORM.name, nameEl.value.trim()], [FORM.school, CFG.school || ''], [FORM.set, setText], [FORM.time, fmtKo(r.ms)], [FORM.hard, hardText]];
    go.href = FORM.url + '?' + pairs.filter(p => p[0]).map(p => encodeURIComponent(p[0]) + '=' + encodeURIComponent(p[1])).join('&');
  };
  nameEl.value = store.get(K.name) || '';
  nameEl.addEventListener('input', () => { store.set(K.name, nameEl.value.trim()); note.innerHTML = noteHTML; note.classList.remove('warn'); sync(); });
  go.addEventListener('click', e => {
    if (!nameEl.value.trim()) { e.preventDefault(); note.textContent = '이름부터 써 줘.'; note.classList.add('warn'); nameEl.focus(); }
  });
  sync();
}

/* 데스크톱: 스페이스/엔터 = 뜻 보기, 1·2·3 = 몰랐어·애매해·알았어 */
document.addEventListener('keydown', e => {
  if (S.view !== 'study' || !C || C.d !== 'ek') return;
  const tg = e.target && e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA') return;
  if (!C.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); reveal(true); }
  else if (C.revealed && (e.key === '1' || e.key === '2' || e.key === '3')) { e.preventDefault(); gradeEK(['no', 'meh', 'yes'][+e.key - 1]); }
});
document.addEventListener('visibilitychange', () => {
  const s = S.sess;
  if (!s || S.view !== 'study') return;
  if (document.hidden) { tick(s); save(); } else s.lt = Date.now();
});

renderHome();
})();
</script>
